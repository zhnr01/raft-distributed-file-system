name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: install project
        run: uv pip install --system -e ".[dev]"
      - name: lint
        run: ruff check .
      - name: format check
        run: ruff format --check .
      - name: types
        run: python -m mypy
      - name: proto freeze check
        run: |
          bash scripts/gen_proto.sh
          git diff --exit-code -- src/dfs/proto
      - name: tests
        run: python -m pytest -q
